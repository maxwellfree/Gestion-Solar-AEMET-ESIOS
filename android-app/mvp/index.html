<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b6e4f">
  <title>Gestión Solar Predictiva</title>

  <!-- OnsenUI (empaquetado localmente por «make mvp») -->
  <link rel="stylesheet" href="vendor/lib/onsenui/css/onsenui.css">
  <link rel="stylesheet" href="vendor/lib/onsenui/css/onsenui-fonts.css">
  <link rel="stylesheet" href="vendor/lib/onsenui/css/onsen-css-components.css">

  <link rel="stylesheet" href="css/app.css">
  <link rel="manifest" href="manifest.webmanifest">
</head>
<body>

  <div id="app" class="gs-app"></div>

  <!-- Capa de arranque / progreso del motor Python -->
  <div id="boot-overlay" class="gs-boot" hidden>
    <div class="gs-boot__box">
      <div class="gs-spinner" role="status" aria-label="Cargando"></div>
      <div id="boot-message" class="gs-boot__message">Iniciando…</div>
    </div>
  </div>

  <!-- ============================ Plantillas ============================ -->

  <template id="tpl-welcome">
    <section class="gs-screen-root">
      <div class="gs-welcome">
        <div class="gs-logo" aria-hidden="true">☀</div>
        <h1 class="gs-welcome__title">Gestión Solar Predictiva</h1>
        <p class="gs-lead">
          Planifica el uso de tu energía combinando previsión meteorológica,
          producción solar, batería, demanda y datos del sistema eléctrico.
        </p>
        <p class="gs-muted">
          La aplicación recomienda acciones. No controla automáticamente tus equipos.
        </p>
        <ons-button id="btn-start" modifier="large" class="gs-btn-block gs-btn-primary">COMENZAR</ons-button>
        <ons-button id="btn-demo" modifier="large" class="gs-btn-block">Probar con datos de demostración</ons-button>
        <p class="gs-hint">Necesitarás la clave de AEMET y el token de ESIOS.</p>
      </div>
    </section>
  </template>

  <template id="tpl-onboarding">
    <section class="gs-screen-root">
      <header class="gs-topbar">
        <ons-button id="ob-exit" modifier="quiet" class="gs-hidden">Salir</ons-button>
        <div class="gs-topbar__title">Configuración</div>
        <span id="ob-step-label" class="gs-step-label"></span>
      </header>
      <div class="gs-onboard gs-scroll">
        <div class="gs-progress"><i id="ob-progress-fill"></i></div>
        <h2 id="ob-title"></h2>
        <div id="ob-body" class="gs-form"></div>
        <div id="ob-errors" class="gs-errors" hidden></div>
      </div>
      <div class="gs-actions">
        <ons-button id="ob-back" modifier="quiet" class="gs-action">ATRÁS</ons-button>
        <ons-button id="ob-next" class="gs-action gs-btn-primary">CONTINUAR</ons-button>
      </div>
    </section>
  </template>

  <template id="tpl-shell">
    <section class="gs-screen-root gs-shell">
      <header class="gs-topbar">
        <div class="gs-topbar__title" id="shell-title">Hoy</div>
        <ons-button id="btn-refresh" modifier="quiet" title="Actualizar datos" aria-label="Actualizar datos">↻</ons-button>
      </header>
      <main class="gs-content">
        <section id="view-hoy" class="gs-view gs-view--active"></section>
        <section id="view-semana" class="gs-view"></section>
        <section id="view-energia" class="gs-view"></section>
        <section id="view-ajustes" class="gs-view"></section>
      </main>
      <nav class="gs-tabbar" role="tablist">
        <button type="button" class="gs-tab gs-tab--active" data-view="hoy" data-title="Hoy">Hoy</button>
        <button type="button" class="gs-tab" data-view="semana" data-title="Semana">Semana</button>
        <button type="button" class="gs-tab" data-view="energia" data-title="Energía">Energía</button>
        <button type="button" class="gs-tab" data-view="ajustes" data-title="Ajustes">Ajustes</button>
      </nav>
    </section>
  </template>

  <template id="tpl-detail">
    <section class="gs-screen-root">
      <header class="gs-topbar">
        <ons-button id="detail-back" modifier="quiet">← Volver</ons-button>
        <div class="gs-topbar__title" id="detail-title">Detalle</div>
      </header>
      <main id="detail-body" class="gs-detail-body"></main>
    </section>
  </template>

  <!-- ============================ Scripts ============================ -->
  <script src="vendor/lib/jquery.min.js"></script>
  <script src="vendor/lib/onsenui/js/onsenui.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
